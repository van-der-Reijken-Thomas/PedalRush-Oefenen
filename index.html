<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Git oefenrepo</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <header id="menu"></header>
    <main>
      <h1 id="greeting"></h1>
    </main>
    <footer id="footer"></footer>

      import { greeting } from "./src/greeting.js";
      import { renderMenu } from "./src/menu.js";
      import { renderFooter } from "./src/footer.js";

      document.getElementById("greeting").textContent = greeting;
      document.getElementById("menu").innerHTML = renderMenu();
      document.getElementById("footer").textContent = renderFooter();
    </script>
  </body>
